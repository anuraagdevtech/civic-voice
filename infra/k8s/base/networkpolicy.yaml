# Default deny, then allow only what each tier actually needs.
#
# This is the control that limits what a compromised API pod can reach. Without it, an RCE in the API
# has network access to the identity vault, which is the one database whose isolation the privacy
# model actually depends on (docs/PRIVACY.md §6).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civic-api-egress
spec:
  podSelector:
    matchLabels: { app: civic-api }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: postgres-shard } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app: postgres-catalogue } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - to: [{ podSelector: { matchLabels: { app: kafka } } }]
      ports: [{ protocol: TCP, port: 9092 }]
    - to: [{ namespaceSelector: { matchLabels: { name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    # Note what is absent: no egress to the identity vault. The API never needs it, and a compromised
    # API pod therefore cannot reach the blind indexes. Verification runs as its own workload.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: civic-worker-egress
spec:
  podSelector:
    matchLabels: { app: civic-worker }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: postgres-shard } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app: postgres-catalogue } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    - to: [{ podSelector: { matchLabels: { app: kafka } } }]
      ports: [{ protocol: TCP, port: 9092 }]
    - to: [{ podSelector: { matchLabels: { app: clickhouse } } }]
      ports: [{ protocol: TCP, port: 8123 }]
    - to: [{ namespaceSelector: { matchLabels: { name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
